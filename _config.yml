title: "On Life & Everything"
author: "Hakan Altun"
description: "Hakan Altun is a lecturer based in İstanbul. Author of The Fragments. Essays and short fiction about what stays and what doesn't."
url: "https://hakanaltun.io"
baseurl: ""

permalink: /pieces/:slug.html

future: true

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap

# Words with Stories. The collection is "words" because that is what the
# templates read (site.words), but it is served from /word/:name/ — singular,
# and one path segment away from /words/, which is the Counter instrument and
# has nothing to do with the series. /word/ is the series index.
#
# Each entry carries its own word, pos, teaser and description in front
# matter, and the story as its body. That is the whole record: the homepage
# strip, the index and the previous/next arrows all read the same files, so
# adding a word is adding one file and nothing else.
collections:
  words:
    output: true
    permalink: /word/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - scripts
  - package.json
  - package-lock.json

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Hakan Altun"
  - scope:
      path: ""
      type: "words"
    values:
      layout: "word"
      og_type: "article"
  # The Google verification stub is a bare static file (no front matter), so
  # jekyll-sitemap can only be told to skip it from here.
  - scope:
      path: "google51b64a9a40664f6d.html"
    values:
      sitemap: false

# --- Added for Jekyll 4 (standalone, no github-pages gem) ---
# Use the modern Sass implementation bundled with Jekyll 4
sass:
  style: compressed
