# _data/guesses.yml — "guess the word" için onaylanmış kelimeler.
#
# Okur bir paragraf seçer, o paragraftaki bu kelimeler boşalır, okur elle
# doldurur. Yanlış diye bir şey yok: yazdığı kelime kutuda kalır, isterse
# orijinali görür ve ikisi yan yana durur.
#
# Adaylar bir sezgiselden çıkıyor ama liste elle onaylanmış. Sezgisel iki tür
# arıyor:
#   yargı  — yerine başka kelime de konabilirdi; yazarın seçimini sorar
#   sözcük — korpusta nadir ve somut; doğrusunu görünce öğrenilir
#
# Bir kelimenin tek başına doğru cevabı olması sorun değil: bilinmiyorsa
# orijinali görmek zaten kazanç. Elenenler renksiz olanlar (öğretecek şeyi yok),
# bağlamın ele verdikleri ve yerleşik kalıplar.
#
# Kural: her kelime parçada YALNIZCA BİR KEZ geçiyor olmalı — yoksa boşluk
# metnin başka bir yerinden okunur. Yeni kelime eklerken buna dikkat.
# Bir paragrafta en az 3 kelime yoksa o paragraf oyuna açılmaz.
#
# YAML tuzağı: true/false/yes/no/on/off/y/n kelimeleri tırnak içinde yazılmalı,
# yoksa YAML onları boolean'a çevirir ve kelime kaybolur.
#
# Satırların üstündeki yorum, kelimenin geçtiği cümledir. Silmek için satırı
# sil; eklemek için parçanın altına yaz.


