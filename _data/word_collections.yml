# Each word belongs to at most one collection. Words without a collection wait off the public index.
# Within a group, place entries in the approximate historical order of the story's
# key event or linguistic setting, rather than forcing a narrative arc. A word's
# root, first English attestation and later famous event are often different dates;
# do not claim exact dates or strict priority where the evidence is ambiguous.
- id: sky
  title: "The Sky Above Us"
  teaser: "How stars, the Moon and the search for signals shaped the ways people explain their lives."
  introduction: "People once looked to the sky for explanations of misfortune, fate and the mind. The words carry those beliefs into the present. A much later radio signal gave an old expression a place in astronomy."
  words: [consider, lunatic, influence, mercurial, saturnine, jovial, disaster, wow]
- id: inner
  title: "The Inner Life"
  teaser: "How people named longing, sadness, fear and wanting."
  introduction: "The names we give our feelings preserve older ideas about the body, memory and the imagination. These words show how the explanations changed while the feelings remained familiar."
  words: [melancholy, desire, nightmare, thrill, nostalgia]
- id: names
  title: "The Names That Remained"
  teaser: "When people and fictional characters became everyday words."
  introduction: "A person’s name can outlive its owner and lose its capital letter. Sometimes the story is documented, sometimes a familiar explanation has grown in the telling. These names show both possibilities."
  words: [mentor, algorithm, pamphlet, quixotic, guy, silhouette, sandwich, chauvinism, maverick, boycott]
- id: travel
  title: "Words That Travelled"
  teaser: "The routes by which trade, encounters and learning reshaped English."
  introduction: "Words cross borders with objects, habits and knowledge. Their changing sounds preserve traces of the languages and people they passed through."
  words: [meander, zero, algebra, divan, checkmate, assassin, hazard, turquoise, biscuit, horde, tulip, magazine, sherbet, bergamot, kiosk, yacht, juggernaut, bosh, emoji]
- id: hours
  title: "The Hours We Invented"
  teaser: "How people divided time and set limits around it."
  introduction: "Our clocks and calendars feel natural, yet many everyday terms for time grew out of conventions, restrictions and old practices. Their histories reveal who drew the boundaries and why."
  words: [noon, curfew, quarantine, deadline]
- id: learning
  title: "Learning to Learn"
  teaser: "How the places and practices of knowledge acquired their names."
  introduction: "Learning has happened in rooms, public spaces, collections and conversation. The language of education keeps traces of the ways knowledge was passed on."
  words: [school, museum, culture, pupil, text, lecture, trivia, rosetta-stone]
- id: living
  title: "Living Together"
  teaser: "The images hidden in words for companionship and conflict."
  introduction: "Sharing food, watching neighbours and deciding who belongs all left marks on the words we use for one another. Their histories run from ancient civic procedures to old words for kinship and neighbours."
  words: [ostracism, rival, companion, eavesdrop, gossip]
- id: work
  title: "Work and Worth"
  teaser: "The history of labour, resources, money and the value assigned to them."
  introduction: "Payment, trade, mining and resistance at work each have a vocabulary with older objects, hazards and customs behind it. Miners who expected silver from an ore and could not get it out blamed a goblin. Read together, the words trace changing ideas of what labour is worth."
  words: [salary, bank, bankruptcy, cobalt, freelance, sabotage, robot]
- id: made
  title: "Words Made on Purpose"
  teaser: "Words that began with someone choosing a name."
  introduction: "Most words have no single maker. These began with someone who needed a name: for an island in a book, for a kind of lucky discovery, for rays nobody yet understood and for the smell of rain. Each name can be traced to the page where it first appeared."
  words: [utopia, serendipity, x-ray, petrichor]
- id: seeing
  title: "Seeing & Light"
  teaser: "The openings, objects and images that gave us words for seeing."
  introduction: "An opening could be an eye in a wall, a piece of glass could be named after a seed, and a room could become the name of a machine. These words trace how people gathered light, brought an image into focus and learned to keep what they saw."
  words: [window, focus, lens, camera]
- id: body
  title: "The Body"
  teaser: "The names of bodies, disease and the ways people tried to understand them."
  introduction: "A moving muscle suggested a mouse, and dissection gave anatomy its name. People also named diseases after mistaken causes and treatments after an animal or an old prayer. The words preserve what they saw, believed and learned."
  words: [muscle, anatomy, placebo, malaria, vaccine]
- id: public
  title: "Public Life"
  teaser: "How assemblies, candidates, voting and public office were named."
  introduction: "Ancient cities distinguished private people from public officeholders. Roman clothing and religious customs entered the vocabulary of office. Later assemblies and voting practices added names of their own."
  words: [idiot, candidate, inaugurate, parliament, ballot]
- id: changing
  title: "Words That Changed Shape"
  teaser: "The unexpected turns a word can take between one use and another."
  introduction: "A pebble moved on a counting board became a sum, and a ball of thread became a hint. A piece of clothing lost a letter when speakers divided a phrase differently. The stuffing of a dish became a kind of play, while seeds scattered by hand gave a name to signals sent to millions. These changes happened by different routes, and each word keeps the earlier use close to the surface."
  words: [tragedy, calculate, farce, apron, clue, broadcast]
- id: judging
  title: "How We Judge"
  teaser: "How words of praise, blame and respect changed their meaning."
  introduction: "A word for someone fortunate became an insult, and a word for a fool became a compliment. Social rank and scholarly reputation also left their marks on the language of judgement. These words show how descriptions acquire contempt, how praise develops and how strong feelings become everyday expressions."
  words: [silly, villain, nice, awful, dunce, prestige]
