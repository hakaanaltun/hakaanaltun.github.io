# Each word belongs to at most one collection. Words without a collection wait off the public index.
# Within a group, place entries in the approximate historical order of the story's
# key event or linguistic setting, rather than forcing a narrative arc. A word's
# root, first English attestation and later famous event are often different dates;
# do not claim exact dates or strict priority where the evidence is ambiguous.
- id: sky
  title: "The Sky Above Us"
  teaser: "How stars, the Moon and the search for signals shaped the ways people explain their lives."
  introduction: "People once looked to the sky for explanations of misfortune, fate and the mind. The words carry those beliefs into the present. A much later radio signal gave an old expression a place in astronomy."
  words: [consider, lunatic, influence, disaster, wow]
- id: inner
  title: "The Inner Life"
  teaser: "How people named longing, sadness, fear and wanting."
  introduction: "The names we give our feelings preserve older ideas about the body, memory and the imagination. These words show how the explanations changed while the feelings remained familiar."
  words: [melancholy, desire, nightmare, nostalgia]
- id: names
  title: "The Names That Remained"
  teaser: "When people and fictional characters became everyday words."
  introduction: "A person's name can outlive its owner and lose its capital letter. Sometimes the story is documented, sometimes a familiar explanation has grown in the telling. These names show both possibilities."
  words: [mentor, algorithm, pamphlet, dunce, quixotic, guy, silhouette, sandwich, maverick, boycott]
- id: travel
  title: "Words That Travelled"
  teaser: "The routes by which trade, encounters and learning reshaped English."
  introduction: "Words cross borders with objects, habits and knowledge. Their changing sounds preserve traces of the languages and people they passed through."
  words: [zero, algebra, assassin, turquoise, biscuit, horde, tulip, magazine, kiosk, yacht, juggernaut, bosh, emoji]
- id: hours
  title: "The Hours We Invented"
  teaser: "How people divided time and set limits around it."
  introduction: "Our clocks and calendars feel natural, yet many everyday terms for time grew out of conventions, restrictions and old practices. Their histories reveal who drew the boundaries and why."
  words: [noon, curfew, quarantine, deadline]
- id: learning
  title: "Learning to Learn"
  teaser: "How the places and practices of knowledge acquired their names."
  introduction: "Learning has happened in rooms, public spaces, collections and conversation. The language of education keeps traces of the ways knowledge was passed on."
  words: [school, museum, culture, pupil, text, lecture, trivia, rosetta-stone]
- id: living
  title: "Living Together"
  teaser: "The images hidden in words for companionship and conflict."
  introduction: "Sharing food, watching neighbours and deciding who belongs all left marks on the words we use for one another. Their histories run from ancient civic procedures to old words for kinship and neighbours."
  words: [ostracism, rival, companion, eavesdrop, gossip]
- id: work
  title: "Work and Worth"
  teaser: "The history of labour, money and the value assigned to them."
  introduction: "Payment, trade, debt and resistance at work each have a vocabulary with older objects and customs behind it. Read together, the words trace changing ideas of what labour is worth."
  words: [salary, bank, bankruptcy, sabotage, robot]
- id: made
  title: "Words Made on Purpose"
  teaser: "Words that began with someone choosing a name."
  introduction: "Most words have no single maker. These began with someone who needed a name: for an island in a book, for a kind of lucky discovery, for rays nobody yet understood and for the smell of rain. Each name can be traced to the page where it first appeared."
  words: [utopia, serendipity, x-ray, petrichor]
