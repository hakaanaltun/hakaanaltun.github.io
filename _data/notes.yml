# Notes—short things, out loud.
#
# Newest first is handled automatically; add a new block anywhere.
#   id    — the anchor (/notes/#slug). Lowercase, no spaces.
#   date  — YYYY-MM-DD, in quotes.
#   body  — Markdown. A blank line starts a new paragraph.

- id: cat-in-the-rain
  date: "2026-08-01"
  body: |
    I was reading *Cat in the Rain* and thinking about the iceberg theory. Is it right to leave the reader this much room?

    You mean *a* when you write it. Some read *b*, some read *c*, and some just think, *What the hell is this?* But yes, that's the beauty of it.
