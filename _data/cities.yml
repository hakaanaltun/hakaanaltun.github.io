# _data/cities.yml — the places the site knows the sky over.
#
# One list, two readers:
#   * _includes/sky-ramp.html — the zone table behind the Follow the sky
#     theme, emitted as bare coordinates, rounded, before first paint
#   * twilight/index.html — the same table plus names, the row of links
#     under the numerals, and the full list in the notes
#
# The site never asks for a location. It reads the IANA time zone the
# browser already reports and looks it up here; an unlisted zone falls back
# to a nominal point on the equator at the device's UTC offset. So a row
# earns its place by being the plausible answer to "whose clock is this",
# not by being a large city: one entry per zone, at the population's centre
# of gravity rather than the zone's namesake where the two part company
# (Asia/Kolkata is answered with Delhi).
#
# Fields:
#   slug   the ?city= name on /twilight/, and the key in its CITIES object
#   name   as displayed
#   tz     the IANA zone this city answers for
#   also   older or alternate zone strings browsers still report for it
#   lat    degrees north, negative south — city centre, ±0.05° is plenty
#   lng    degrees east, negative west
#   row    a place in the row of links beneath the times on /twilight/,
#          and where in it: the row is sorted on this number
#   alias  a second city inside a zone another entry already answers for:
#          pickable by ?city=, never the answer to a zone lookup
#
# Coordinates are city centres to three decimals, which is nearer than the
# ±1–2 minutes the almanac arithmetic itself is good for.

