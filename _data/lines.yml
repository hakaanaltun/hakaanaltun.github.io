# _data/lines.yml — single lines from the book and the pieces.
#
# Two readers, one list: the quote at the top of the homepage, which shows
# them all, and the bookshelf in The House (/house/), which puts one line
# from the book and one from the pieces out each day. The House leaves out
# lines from the pieces in _data/unsuggested.yml, as every picker does.
#
# A line from The Fragments names its chapter and the chapter's address:
#   chapter  the chapter title, as the book prints it
#   url      /book/part-…/#chapter-id
# A line from a piece names the piece; the title and address are read from
# the post itself, so a renamed piece needs nothing changed here:
#   piece    the post's `slug`
#
# text is the line as it stands on the page. \n breaks it where the page does.

- text: "I had no memory because memory needs an after, and there was no after."
  chapter: "Point Zero"
  url: /book/part-one/#point-zero

- text: "The light should have taken me too. It did not."
  chapter: "The First Disobedience"
  url: /book/part-one/#the-first-disobedience

- text: "The dark filled with small fires, each one a holding."
