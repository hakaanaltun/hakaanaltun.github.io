<div class="book-resume{% if include.panel %} book-resume--panel{% endif %}" data-book-resume{% if include.panel %} data-book-resume-panel{% endif %} hidden>
  <a class="book-resume-link" data-book-resume-link href="/book/">
    <svg viewBox="0 0 20 24" width="15" height="18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 2h14v20l-7-5-7 5Z"/></svg>
    <span>Continue reading <span aria-hidden="true">→</span></span>
  </a>
  <p class="book-resume-place" data-book-resume-place></p>
  <div class="book-resume-foot">
    <span>Your place is saved in this browser.</span>
    <button type="button" data-book-resume-clear aria-label="Clear saved reading place">Clear</button>
  </div>
</div>
