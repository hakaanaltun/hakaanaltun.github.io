<script>
    (function(){
      'use strict';

      /* The lines live in _data/lines.yml, which The House's bookshelf also
         reads. s is the chapter or piece, u its address, b marks the book. */
      var heroQuotes = [
        {%- for line in site.data.lines -%}
        {%- if line.chapter -%}
        {"s":{{ line.chapter | jsonify }},"t":{{ line.text | jsonify }},"u":{{ line.url | jsonify }},"b":true}
        {%- else -%}
        {%- assign line_post = site.posts | where: "slug", line.piece | first -%}
        {"s":{{ line_post.title | replace: "'", "’" | jsonify }},"t":{{ line.text | jsonify }},"u":{{ line_post.story_url | default: line_post.url | relative_url | jsonify }}}
        {%- endif -%}{%- unless forloop.last -%},{%- endunless %}
        {%- endfor %}
      ];

      var hq = document.getElementById('hero-quote');
      var qs = document.getElementById('hero-quote-source');
      var quoteStatus = document.getElementById('hero-quote-status');
      var prevBtn = document.getElementById('quote-prev');
      var nextBtn = document.getElementById('quote-next');
      var qCard = document.querySelector('.hero-quote-card');
      var qNav = document.querySelector('.quote-nav');
      var currentIdx = -1;
      var history = [];
      var rotateTimer = null;
      var renderTimer = null;
      var sourceTimer = null;
      var wordTimers = [];
      var navHideTimer = null;
      var ROTATE_DELAY = 15000;
      /* Matches the crossfade duration CSS gives .hero-quote-text under
         reduced motion, so the new quote lands as the old one finishes. */
      var FADE_DELAY = 320;
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function randomIndex(except){
        if(heroQuotes.length < 2) return 0;
        var idx;
        do { idx = Math.floor(Math.random() * heroQuotes.length); } while(idx === except);
        return idx;
      }

      function clearRenderTimers(){
        clearTimeout(renderTimer);
        clearTimeout(sourceTimer);
        wordTimers.forEach(function(t){ clearTimeout(t); });
        wordTimers = [];
      }

      function setSource(pick){
        qs.textContent = '— ';
        var title = document.createElement('i');
        var label = pick.b ? pick.s + ' · The Fragments' : pick.s;
        title.textContent = label;
        var url = pick.u;
        if(url){
          var link = document.createElement('a');
          link.href = url;
          link.appendChild(title);
          qs.appendChild(link);
        } else {
          qs.appendChild(title);
        }
      }

      function paintQuote(pick, animate, announce){
        hq.innerHTML = '';
        /* A quote carrying l: is not in the page's language. Marking the
           paragraph lets a screen reader switch voices for it instead of
           reading Turkish with English phonetics; the same tag is put on the
           live-region copy below, which is what actually gets announced. */
        if(pick.l) hq.setAttribute('lang', pick.l); else hq.removeAttribute('lang');
        pick.t.split('\n').forEach(function(line,lineIndex){
          if(lineIndex) hq.appendChild(document.createElement('br'));
          if(!animate){
            hq.appendChild(document.createTextNode(line));
            return;
          }
          line.split(/(\s+)/).forEach(function(part,partIndex){
            if(part.trim()==='') { hq.appendChild(document.createTextNode(part)); return; }
            var span = document.createElement('span');
            span.className = 'hero-quote-word';
            span.textContent = part;
            hq.appendChild(span);
            wordTimers.push(setTimeout(function(){
              span.classList.add('word-visible');
            }, 80 + partIndex * 35 + lineIndex * 220));
          });
        });
        setSource(pick);
        if(animate){
          sourceTimer = setTimeout(function(){ qs.classList.add('visible'); }, 650);
        } else {
          qs.classList.add('visible');
        }
        hq.style.opacity = '1';
        /* Manual navigation gets one atomic announcement. The visible card
           itself stays quiet, so word-by-word DOM updates are never read as
           a stream of separate live-region changes. */
        if(announce && quoteStatus){
          if(pick.l) quoteStatus.setAttribute('lang', pick.l); else quoteStatus.removeAttribute('lang');
          quoteStatus.textContent = pick.t.replace(/\n/g, ' ') + ' — ' + (pick.b ? pick.s + ' · The Fragments' : pick.s);
        }
        schedule();
      }

      function render(idx, pushHistory, announce){
        if(!hq || !qs || !heroQuotes[idx]) return;
        if(pushHistory && currentIdx > -1) history.push(currentIdx);
        currentIdx = idx;
        clearRenderTimers();
        qs.classList.remove('visible');
        var pick = heroQuotes[idx];
        /* Reduced motion drops the per-word travel — that is the part which
           actually moves — but the quote still changes. The card crossfades
           on opacity alone, which carries no direction to follow. */
        var animate = !reduceMotion.matches;
        hq.style.opacity = '0';
        renderTimer = setTimeout(function(){
          paintQuote(pick, animate, announce);
        }, animate ? 260 : FADE_DELAY);
      }

      function schedule(){
        clearTimeout(rotateTimer);
        if(qs && qs.contains(document.activeElement)) return;
        /* Automatic swaps stay silent; only explicit Previous/Next actions
           update the live status. */
        rotateTimer = setTimeout(function(){
          render(randomIndex(currentIdx), true, false);
        }, ROTATE_DELAY);
      }

      /* Keep the destination stable while its link has keyboard focus. */
      if(qs){
        qs.addEventListener('focusin', function(){ clearTimeout(rotateTimer); });
        qs.addEventListener('focusout', function(){ setTimeout(schedule, 0); });
      }

      function showNav(){
        if(!qNav) return;
        qNav.classList.add('quote-nav-visible');
        clearTimeout(navHideTimer);
        navHideTimer = setTimeout(function(){ qNav.classList.remove('quote-nav-visible'); }, 2200);
      }

      if(prevBtn) prevBtn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation(); showNav();
        var previous = history.length ? history.pop() : randomIndex(currentIdx);
        render(previous, false, true);
      });

      if(nextBtn) nextBtn.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation(); showNav();
        render(randomIndex(currentIdx), true, true);
      });

      if(qCard) qCard.addEventListener('click', function(e){
        if(e.target.closest('.quote-nav-btn, a')) return;
        showNav();
      });

      // Hide quote nav when tapping outside the card (mobile)
      document.addEventListener('touchstart', function(e){
        if(!qNav || !qCard) return;
        if(!qCard.contains(e.target)){
          qNav.classList.remove('quote-nav-visible');
          clearTimeout(navHideTimer);
        }
      });

      if(hq) render(randomIndex(-1), false, false);
    })();
    </script>

<script src="/js/astronomy.js?v=20260925-1"></script>
<script>
/* Tonight — the closing line: the moon plus the sun where the visitor's
   browser clock says they are. The same 77-city time-zone table resolves
   the site's sky theme and /twilight/; unknown zones keep their own clock
   and use the theme's nominal equatorial fallback. */
(function(){
  'use strict';
  var strip = document.getElementById('tonight');
  var moonEl = document.getElementById('tonight-moon');
  var sunEl = document.getElementById('tonight-sun');
  if(!strip || !moonEl || !sunEl || !window.OLAE_ASTRO) return;
  var ASTRO = window.OLAE_ASTRO;

  var now = new Date();

  var lun = ASTRO.lunation(now);
  var age = (lun - Math.floor(lun)) * ASTRO.SYNODIC;
  var illum = Math.round((1 - Math.cos(2 * Math.PI * age / ASTRO.SYNODIC)) / 2 * 100);
  var names = ['new moon', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full moon', 'waning gibbous', 'last quarter', 'waning crescent'];
  var phase = names[ASTRO.moonPhaseIndex(age)];
  moonEl.textContent = phase + ', ' + illum + '% lit';

  var place = window.OLAE_SKY && window.OLAE_SKY.pickCity ? window.OLAE_SKY.pickCity() : null;
  var LAT = place ? place.lat : 41.015;
  var LNG = place ? place.lng : 28.979;
  var TZ = place && place.tz ? place.tz : 'Europe/Istanbul';
  var ZONE_NAMES = {
    "": "",
{% for c in site.data.cities %}{% unless c.alias %}    "{{ c.tz }}":"{{ c.name }}",{% for z in c.also %}"{{ z }}":"{{ c.name }}",{% endfor %}
{% endunless %}{% endfor %}  };
  var placeName = Object.prototype.hasOwnProperty.call(ZONE_NAMES, TZ) ? ZONE_NAMES[TZ] : "";

  function sunEvent(dayShift, rising){
    var s = new Date(now.getTime() + ASTRO.tzOffsetMs(TZ, now) + dayShift * 86400000);
    var y = s.getUTCFullYear(), mo = s.getUTCMonth(), d = s.getUTCDate();
    var n = Math.floor((Date.UTC(y, mo, d) - Date.UTC(y, 0, 0)) / 86400000);
    return ASTRO.sunEvent({ n: n, y: y, mo: mo, d: d }, rising, 90.833, LAT, LNG, TZ);
  }
  var fmtTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
  var where = placeName ? ' in ' + placeName : '';
  var sunset = sunEvent(0, false);
  if(sunset && now < sunset){
    sunEl.textContent = 'sunset ' + fmtTime.format(sunset) + where;
  } else {
    var sunrise = sunEvent(1, true);
    if(sunrise) sunEl.textContent = 'sunrise ' + fmtTime.format(sunrise) + where;
  }
  if(moonEl.textContent && sunEl.textContent) strip.hidden = false;
})();
</script>
