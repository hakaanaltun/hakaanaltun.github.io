<a class="tools-link" href="/tools/" aria-label="All the instruments">&larr;&#8202;instruments</a>
<script data-tool-return>
(function(){
  'use strict';
  /* The House opens an instrument with from=house, or from=balcony from
     its balcony; a note in the drawer opens The Page with from=drawer.
     Whichever it is, the way back goes where the reader came from. */
  var from = new URLSearchParams(window.location.search).get('from');
  if(from !== 'house' && from !== 'balcony' && from !== 'drawer') return;
  var back = document.querySelector('.tools-link');
  if(from === 'house'){
    back.href = '/house/#study';
    back.textContent = '← the study';
    back.setAttribute('aria-label', 'Back to The House study');
  } else if(from === 'balcony'){
    back.href = '/house/#balcony';
    back.textContent = '← the balcony';
    back.setAttribute('aria-label', 'Back to The House balcony');
  } else {
    back.href = '/house/#drawer';
    back.textContent = '← your drawer';
    back.setAttribute('aria-label', 'Back to your drawer');
  }
})();
</script>
