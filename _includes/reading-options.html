<details class="reading-options" id="reading-options" hidden>
  <summary>Reading options</summary>
  <div class="reading-panel">
    <div class="reading-settings">
      <label for="reading-size">Text size
        <select id="reading-size"><option value="1">Original</option><option value="1.15">Larger</option><option value="1.3">Largest</option></select>
      </label>
      <label for="reading-spacing">Line spacing
        <select id="reading-spacing"><option value="1.85">Original</option><option value="2.1">Wider</option><option value="2.4">Widest</option></select>
      </label>
    </div>
    <div class="reading-actions">
      <button type="button" id="reading-reset">Reset reading settings</button>
      <button type="button" id="reading-print">Print or save as PDF</button>
      {% comment %} /noise/'s synthesized rain, quietly behind the essay.
      js/rain-read.js unhides the button where Web Audio exists. {% endcomment %}
      <button type="button" class="essay-rain" id="essay-rain" aria-pressed="false" hidden>read with rain</button>
    </div>
    <p class="reading-status" id="reading-settings-status" role="status"></p>
    <section class="reading-listen" id="reading-listen" aria-label="Listen to this piece" hidden>
      <div class="reading-actions">
        <button type="button" id="reading-play">Listen</button>
        <button type="button" id="reading-stop" hidden>Stop</button>
        <label for="reading-speed">Speed <select id="reading-speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select></label>
        <label for="reading-voice" id="reading-voice-label" hidden>Voice <select id="reading-voice"></select></label>
      </div>
      <p class="reading-status" id="reading-listen-status" role="status"></p>
    </section>
    <section class="reading-offline" aria-label="Offline reading" data-offline-shelf hidden>
      <button type="button" id="reading-save">Save for offline</button>
      <p class="reading-status" data-offline-status role="status"></p>
      <details><summary>Saved pieces <span data-offline-count></span></summary><ul class="offline-list" data-offline-list></ul></details>
    </section>
  </div>
</details>
<p class="essay-print-byline">Hakan Altun · {{ page.url | absolute_url }}</p>
