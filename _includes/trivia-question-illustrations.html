{% if page.quiz == 'britain' %}
<script>
(function () {
  'use strict';

  var panel = document.getElementById('trivia-question');
  var heading = document.getElementById('trivia-question-text');
  var data = document.getElementById('trivia-data');
  if (!panel || !heading || !data || !window.MutationObserver) return;

  // Original illustrative drawings, not photographs of historical objects.
  // Each picture shows the question's subject without depicting its answer.
  // The six cells share one image, fetched only for an illustrated question.
  var illustrations = {
    'great-bell': [0, 0, 'A red London bus beside a streetlamp.'],
    'underground-steam-trains': [1, 0, 'Steps and railings at an underground railway entrance.'],
    'arthur-round-table-equality': [2, 0, 'An open storybook with a little castle rising from its pages.'],
    'tea-locked-caddies': [0, 1, 'A cup of tea on a saucer with loose tea leaves nearby.'],
    'sandwich-earls-title': [1, 1, 'A triangular sandwich with cheese and cucumber between slices of bread.'],
    'football-cards-traffic-lights': [2, 1, 'Red and yellow referee cards beside a whistle.']
  };
  var byQuestion = Object.create(null);
  try {
    JSON.parse(data.textContent).forEach(function (question) {
      if (illustrations[question.id]) byQuestion[question.question] = illustrations[question.id];
    });
  } catch (error) { return; }

  var holder = document.createElement('div');
  holder.id = 'trivia-question-illustration';
  holder.hidden = true;
  heading.parentNode.insertBefore(holder, heading);
  var shown = null;
  var ns = 'http://www.w3.org/2000/svg';

  function update() {
    var item = byQuestion[panel.getAttribute('data-keep-title')];
    if (!item) {
      holder.hidden = true;
      holder.textContent = '';
      shown = null;
      return;
    }
    if (shown === item) return;
    holder.textContent = '';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', '96');
    svg.setAttribute('height', '96');
    svg.setAttribute('viewBox', (item[0] * 512) + ' ' + (item[1] * 512) + ' 512 512');
    svg.setAttribute('overflow', 'hidden');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-labelledby', 'trivia-illustration-title');
    svg.setAttribute('focusable', 'false');
    var title = document.createElementNS(ns, 'title');
    title.id = 'trivia-illustration-title';
    title.textContent = item[2];
    svg.appendChild(title);
    var picture = document.createElementNS(ns, 'image');
    picture.setAttribute('width', '1536');
    picture.setAttribute('height', '1024');
    picture.setAttribute('href', '/trivia/assets/britain-question-illustrations.webp');
    picture.addEventListener('error', function () {
      if (holder.firstChild === svg) holder.hidden = true;
    });
    svg.appendChild(picture);
    holder.appendChild(svg);
    holder.hidden = false;
    shown = item;
  }

  // The game already publishes the current question's exact text here for
  // passage keeping. Following it also covers shuffle, resume and retries,
  // without changing the shared game script or its saved-game format.
  var observer = new MutationObserver(update);
  observer.observe(panel, { attributes: true, attributeFilter: ['data-keep-title'] });
  update();
}());
</script>
{% endif %}
