<!-- What the house looks out on, from the study window and the balcony
     alike: the roofs of the neighbourhood, a strip of sea, and the Islands
     on the horizon, part of them behind the taller blocks to the left. It
     is drawn with the horizon at 222, and both rooms show it at
     three-fifths of this size, so the roofs come up to the sea alike in
     each: the window with its horizon at 222, the balcony at 285. The
     window sees the part from about 600 to 1040; through the glass on the
     balcony's right-hand side the roofs and the sea go on to the west.

     Land and sea are laid first in the sky's own colour, so the sun, the
     moon and the stars go behind them and the roofs keep their haze. -->
