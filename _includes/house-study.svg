      <path class="moris-fur" d="M25-39Q22-52 24-58Q31-53 33-46ZM39-46Q42-53 49-58Q51-52 47-39Z"/>
      <path class="moris-ear" d="M26-42Q24.5-50 25.5-53.5Q29.5-50.5 31-46.5ZM41-46.5Q43-50.5 47.5-53.5Q48.5-50 46.5-42Z"/>
