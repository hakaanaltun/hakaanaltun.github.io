      <path class="moris-pupil" d="M-6.5-37.7Q-5.7-35-6.5-32.3Q-7.3-35-6.5-37.7ZM6.5-37.7Q7.3-35 6.5-32.3Q5.7-35 6.5-37.7Z"/>
      <path class="moris-nose" d="M-1.5-29.3H1.5L0-27.4Z"/>
      <path class="moris-whisker" d="M-4-27L-21-30M-4-25.5L-22-25.5M-4-24L-20-21M4-27L21-30M4-25.5L22-25.5M4-24L20-21"/>
