      <path class="moris-pupil" d="M31-35.6Q31.8-33 31-30.4Q30.2-33 31-35.6ZM41.5-35.6Q42.3-33 41.5-30.4Q40.7-33 41.5-35.6Z"/>
      <path class="moris-nose" d="M34.9-27.6H37.7L36.3-25.8Z"/>
      <path class="moris-whisker" d="M33-25L18-27.5M33-23.5L17-23.5M40-25L55-27.5M40-23.5L56-23.5"/>
