    <clipPath id="house-window-clip"><path d="M686 252V129A91 91 0 0 1 868 129V252Z"/></clipPath>
  </defs>
  <path class="house-wall" d="M0 0H1000V650H0Z"/>
  <path class="house-floor" d="M0 470H1000V650H0Z"/>
  <path fill="url(#house-grain)" d="M0 0H1000V650H0Z"/>
