      <path class="moris-sheen" d="M-21-7C-25-18-22-30-14-36M1-67C-1-50-1-26 3-6"/>
      <path class="moris-fur" d="M-11-86Q-14-99-12-105Q-5-100-2-93ZM6-93Q11-100 18-104Q18-97 15-86Z"/>
