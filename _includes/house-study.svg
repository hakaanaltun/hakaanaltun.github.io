  <!-- The cushion stays where it is; Moris does not. He is drawn from his
       photographs (/moris/) in the four places he keeps: sitting on the sill
       with his back to the room, along the top of the bookshelf, a loaf on
       his cushion, and curled up asleep on it. css/house.css shows the one
       that fits İstanbul's hour, which js/house.js writes on the scene. -->
  <g class="house-line"><ellipse class="house-cushion" cx="842" cy="488" rx="75" ry="19"/></g>
  <g class="house-moris">
    <!-- Mornings: sitting on the sill with his back to the room, looking round. -->
