    <path d="M777 38V253M686 145H868"/><path class="house-window-trim" d="M665 259H889V271H665Z"/>
    <path class="house-light-beam" stroke="none" d="M687 272L435 474 673 494 868 272Z"/>
  </g>
  <!-- Rug and chair behind the desk. -->
