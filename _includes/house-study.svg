      <path class="moris-sheen" d="M-5-91.5C0-93.5 6-93.5 10-91.5"/>
      <path class="moris-eye" d="M-7.3-81Q-3.5-85-.3-81Q-3.5-78-7.3-81ZM4.5-81Q8-85 11.7-81Q8-78 4.5-81Z"/>
      <path class="moris-pupil" d="M-3.7-83.6Q-2.9-81-3.7-78.4Q-4.5-81-3.7-83.6ZM8-83.6Q8.8-81 8-78.4Q7.2-81 8-83.6Z"/>
      <path class="moris-nose" d="M1-75.8H3.8L2.4-74Z"/>
      <path class="moris-whisker" d="M-1-73.5L-16-76M-1-72L-17-72M6-73.5L21-76M6-72L22-72"/>
