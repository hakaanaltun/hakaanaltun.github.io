<style>
  .word-story-page {
    max-width: 42rem;
    margin: 0 auto;
    padding: 76px 24px 72px;
  }

  .word-story-series {
    display: inline-block;
    margin-bottom: 18px;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--vizon);
    text-decoration: none;
    transition: var(--select-ease);
  }

  .word-story-series:hover,
  .word-story-series:active { opacity: var(--select-dim); }

  .word-story-series:focus-visible {
    outline: 2px solid var(--petrol);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .word-story-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.7rem, 7vw, 4.5rem);
    line-height: 0.98;
    color: var(--petrol-deep);
    margin: 0 0 34px;
  }

  .word-story-pos {
    font-size: 0.42em;
    color: var(--vizon);
    white-space: nowrap;
  }

  .word-story-body {
    max-width: 36rem;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.12rem;
    line-height: 1.72;
    color: var(--ink);
  }

  .word-story-body p { margin: 0 0 1.35em; }
  .word-story-body p:last-child { margin-bottom: 0; }

  @media (max-width: 600px) {
    .word-story-page { padding: 56px 24px 58px; }
    .word-story-title { margin-bottom: 28px; }
    .word-story-body { font-size: 1.06rem; }
  }
</style>

<article class="word-story-page">
  <a class="word-story-series" href="/#words-with-stories">Words with Stories</a>
  <h1 class="word-story-title">{{ page.word }} <span class="word-story-pos">({{ page.pos }})</span></h1>
  <div class="word-story-body">
    {{ page.story | markdownify }}
  </div>
</article>
