# One-off: copies the journey's images from the pilot site into this
# repository, checking each against the SHA-256 recorded in
# _agents/space-assets.json, and commits them to this branch. Removed once
# the images are in place.
name: Mirror the journey's images

on:
  push:
    branches:
      - claude/mirror-space-images
    paths:
      - .github/workflows/mirror-space-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and check every image
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, urllib.request
          assets = json.load(open('_agents/space-assets.json'))
          out = 'pictures/space/images'
          os.makedirs(out, exist_ok=True)
          total, bad = 0, []
          for name, info in sorted(assets.items()):
              req = urllib.request.Request(info['url'], headers={'User-Agent': 'hakanaltun.io mirror'})
              data = urllib.request.urlopen(req, timeout=60).read()
              digest = hashlib.sha256(data).hexdigest()
              ok = digest == info['sha256']
              print(f"{'ok ' if ok else 'BAD'} {len(data):>10,} {name}")
              if not ok:
                  bad.append(name)
                  continue
              if len(data) > 50_000_000:
                  bad.append(name + ' (over 50 MB)')
                  continue
              open(os.path.join(out, name), 'wb').write(data)
              total += len(data)
          print(f"total {total:,} bytes in {len(assets) - len(bad)} files")
          if bad:
              print('not mirrored:', ', '.join(bad))
              sys.exit(1)
          PY
      - name: Commit the images to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pictures/space/images
          git commit -m "Mirror the journey's images from the pilot site"
          git push
