name: One-time typography cleanup

on:
  push:
    paths:
      - .github/workflows/typography-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean visible typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('_posts/2026-08-29-measured.html'),
              Path('_posts/2026-07-25-it-was-not-a-question.html'),
          ]

          def smarten_text(text: str) -> str:
              # Straight apostrophes used inside words/contractions.
              text = re.sub(r"(?<=[A-Za-zÀ-ÖØ-öø-ÿĞğİıŞşÇçÖöÜü0-9])'(?=[A-Za-zÀ-ÖØ-öø-ÿĞğİıŞşÇçÖöÜü0-9])", '’', text)
              # Paired straight double quotation marks in visible prose.
              text = re.sub(r'"([^"\n]+)"', r'“\1”', text)
              return text

          def smarten_html_body(body: str) -> str:
              # Leave Liquid comments untouched.
              liquid_comments = []
              def stash_liquid(m):
                  liquid_comments.append(m.group(0))
                  return f'@@LIQUID_COMMENT_{len(liquid_comments)-1}@@'
              body = re.sub(r'{%\s*comment\s*%}.*?{%\s*endcomment\s*%}', stash_liquid, body, flags=re.S)

              parts = re.split(r'(<[^>]+>)', body)
              out = []
              raw_depth = 0
              for part in parts:
                  if not part:
                      continue
                  if part.startswith('<'):
                      low = part.lower()
                      if re.match(r'<(style|script|pre|code)\b', low):
                          raw_depth += 1
                      out.append(part)
                      if re.match(r'</(style|script|pre|code)\b', low):
                          raw_depth = max(0, raw_depth - 1)
                  elif raw_depth:
                      out.append(part)
                  else:
                      out.append(smarten_text(part))
              body = ''.join(out)

              for i, original in enumerate(liquid_comments):
                  body = body.replace(f'@@LIQUID_COMMENT_{i}@@', original)
              return body

          for path in files:
              text = path.read_text(encoding='utf-8')
              m = re.match(r'(---\r?\n.*?\r?\n---\r?\n)(.*)', text, flags=re.S)
              if not m:
                  raise RuntimeError(f'Front matter not found: {path}')
              front, body = m.groups()
              path.write_text(front + smarten_html_body(body), encoding='utf-8')

          # Front-matter-only fixes. Keep technical paths/slugs untouched.
          p = Path('_posts/2026-07-25-it-was-not-a-question.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("New Year's Day", "New Year’s Day")
          p.write_text(s, encoding='utf-8')

          p = Path('_posts/2026-06-01-lets-have-some-cheese.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('title: "Let\'s Have Some Cheese"', 'title: "Let’s Have Some Cheese"')
          p.write_text(s, encoding='utf-8')

          p = Path('_posts/2026-06-11-thinking-is-for-after.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("water's edge", "water’s edge")
          p.write_text(s, encoding='utf-8')

          # Correct reversed curly quotation marks in the Italian passages.
          p = Path('_posts/2026-06-04-written-in-ink.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('</em>,“ her mother would say', '</em>,” her mother would say')
          s = s.replace('Lucia would tell her she had only written down what she saw. ”<em>Stessa cosa</em>,“ her mother said. ”<em>Ci metti sempre del tuo</em>”', 'Lucia would tell her she had only written down what she saw. “<em>Stessa cosa</em>,” her mother said. “<em>Ci metti sempre del tuo</em>”')
          s = s.replace('</em>,“ she said. ”<em>Tutte queste facce', '</em>,” she said. “<em>Tutte queste facce')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _posts/2026-08-29-measured.html \
            _posts/2026-07-25-it-was-not-a-question.html \
            _posts/2026-06-04-written-in-ink.html \
            _posts/2026-06-01-lets-have-some-cheese.html \
            _posts/2026-06-11-thinking-is-for-after.html
          git commit -m "Clean up quotation typography"
          git push origin HEAD:${GITHUB_REF_NAME}

# trigger
