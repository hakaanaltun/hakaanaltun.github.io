name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main
  # A pull request gets the same build the deploy would get, so a change is
  # known to render before it is merged. The list used to cover only the code
  # and the templates, which meant a pull request that touched nothing but
  # content — a word story, a post, a quiz — ran no build at all and was
  # merged on trust. Content is where most changes here actually happen, so
  # it is on the list too.
  pull_request:
    paths:
      - 'read/**'
      - 'farm-house/**'
      - 'pictures/**'
      - 'sun/**'
      - 'stars/**'
      - 'js/**'
      - 'css/**'
      - '_layouts/**'
      - '_includes/**'
      - '_plugins/**'
      - 'scripts/**'
      - '_words/**'
      - '_pictures/**'
      - '_posts/**'
      - '_data/**'
      - '*.html'
      - 'AGENTS.md'
      - 'COLOPHON.md'
      - '_agents/**'
      - '_config.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys wait their turn in one queue and are never cancelled midway. A
# pull request's check runs in a queue of its own: when it shared the
# deploys' queue, a check pushed while a merge was waiting could push that
# merge out of the queue, and the merge never reached the site. A newer push
# to the same pull request replaces its older check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A build takes about two minutes. A check that hangs would otherwise
    # hold the deploy queue for six hours, as one did on 12 October 2026.
    timeout-minutes: 20
    steps:
      # Two commits, so that a pull request, checked out as its merge, has
      # the base branch beside it: scripts/test-asset-versions.cjs compares
      # the two for stylesheets and scripts that changed without a new ?v=.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # /images/480/ and /images/960/ are generated here, at build time, so
      # images uploaded through the CMS get their card variants without any
      # manual Pillow step or committed derivatives. Variants that DO exist
      # in the repo are kept as-is.
      - name: Generate image variants
        run: |
          pip install --quiet Pillow
          python scripts/generate_image_variants.py

      - name: Restore bundled PDF reader assets
        run: python scripts/vendor_pdfjs.py

      - name: Setup Node for the browser-tool checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install check dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # The PDF parser against the bundled PDF.js, then the DOM-level checks
      # for The Reader, the footer weather and puzzle mode, and the offline
      # shell against the sw.js the build just rendered — hence after it, and
      # still before the upload. A failure here stops the deploy: the deploy
      # job needs this one.
      - name: Run browser-tool checks
        run: npm test
        timeout-minutes: 10

      # The stylesheets' comments are for whoever edits them next, not for a
      # reader's browser. They stay in the repository and are taken out of
      # the published copy only, after the checks, which read them. The step
      # fails, and nothing is published, if any rule would change.
      - name: Take the comments out of the published stylesheets
        run: node scripts/strip-css-comments.cjs _site/css

      # The scripts' comments go the same way, from the site's own scripts
      # only: js/vendor/ keeps its licences. The step fails, and nothing is
      # published, if any program would read differently.
      - name: Take the comments out of the published scripts
        run: node scripts/strip-js-comments.cjs _site/js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
