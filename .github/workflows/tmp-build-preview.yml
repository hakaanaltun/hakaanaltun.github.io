name: Temporary build for a local look
on:
  push:
    branches: [claude/tmp-build-preview]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --quiet Pillow
          python scripts/generate_image_variants.py
          python scripts/vendor_pdfjs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Run the checks
        run: npm test > test-output.txt 2>&1 || echo "npm test failed with $?" >> test-output.txt
      - name: Keep the built pages on this branch
        run: |
          mkdir -p zz-built
          (cd _site && find . -type f \( -name '*.html' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' \) -exec cp --parents {} ../zz-built/ \;)
          cp test-output.txt zz-built/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zz-built
          git commit -q -m "Built pages for a local look [skip ci]"
          git push origin HEAD:claude/tmp-build-preview
