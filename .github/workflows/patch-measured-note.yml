name: Patch Measured publication note

on:
  push:
    paths:
      - '.github/workflows/patch-measured-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert publication decision note
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('_posts/2026-08-29-measured.html')
          text = path.read_text(encoding='utf-8')
          needle = '''<h2 id="plan-v4">Politik Gerilim—Plan v4</h2>
          <p>3000–4000 kelime · İngilizce · kısa politik-finansal gerilim</p>'''
          replacement = '''<h2 id="plan-v4">Politik Gerilim—Plan v4</h2>
          <h3>Yayın kararı</h3>
          <p>Yazının çok yürünmüş bir yola girmeye başladığını ve konuya yeterince yeni bir şey eklemediğimi düşündüğüm için onu tamamlamamaya karar verdim. Bunun yerine planlanan sahnelerden bazılarını yazıp planın kendisiyle birlikte yayımladım.</p>

          <p>3000–4000 kelime · İngilizce · kısa politik-finansal gerilim</p>'''
          if needle not in text:
              raise SystemExit('Target block not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/2026-08-29-measured.html
          git commit -m "Add publication decision note to Measured v4"
          git push origin HEAD:main
