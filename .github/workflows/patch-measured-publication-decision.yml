name: Patch Measured publication decision

on:
  push:
    paths:
      - '.github/workflows/patch-measured-publication-decision.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace publication decision text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('_posts/2026-08-29-measured.html')
          text = path.read_text(encoding='utf-8')
          old = 'Yazıyı, çok yürünmüş bir yola girmeye başladığını ve konuya yeterince yeni bir şey eklemediğimi düşündüğüm için tamamlamamaya karar verdim. Bunun yerine, planlanan sahnelerden bazılarını yazıp planın kendisiyle birlikte yayımladım.'
          new = 'Yazının tamamı, türün alışkanlıklarına fazla yaklaşmaya başladığı yerde durduruldu. Planlanan sahnelerden dördü yazıldı ve parçalı hâlde bırakıldı. Plan, yazımdan önceki hâliyle onlarla birlikte yayımlanıyor; sahnelerin plandan ayrıldığı yerler altta not edildi.'
          if old not in text:
              raise SystemExit('Target paragraph not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/2026-08-29-measured.html
          git commit -m "Revise Measured publication decision"
          git push origin HEAD:main
