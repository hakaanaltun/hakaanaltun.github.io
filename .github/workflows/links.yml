name: Check cited links

# Once a week, every web address the site cites as a source is fetched to see
# that it is still there (scripts/check-links.cjs). It is kept apart from the
# pull-request build on purpose: a source's site being down for an hour is not
# a reason to hold back a change. A failed run means a cited page is gone, and
# the log names the address and the file it is cited in. Run it by hand from
# the Actions tab at any time.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check cited links
        run: node scripts/check-links.cjs
