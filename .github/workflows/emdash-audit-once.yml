name: One-time em dash comment tidy

on:
  push:
    paths:
      - .github/workflows/emdash-audit-once.yml

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tidy internal examples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('_includes/head.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('joined by a spaced em dash: "Handled—On Life & Everything".', 'joined by a spaced em dash: "Handled — On Life & Everything".')
          s = s.replace('sets one writes the "—On Life & Everything" suffix into it itself.', 'sets one writes the " — On Life & Everything" suffix into it itself.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/head.html
          git commit -m "Tidy em dash house-style comments"
          git push origin HEAD:${GITHUB_REF_NAME}
